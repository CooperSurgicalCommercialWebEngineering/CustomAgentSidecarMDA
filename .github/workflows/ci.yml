name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Model-driven Type Check
        run: npm run typecheck:model-driven

      - name: Unit Tests
        run: npm run test

      - name: Build Model-driven Resources
        run: npm run build:model-driven

      - name: Model-driven Tests
        run: npm run test:model-driven

      - name: Solution Package Validator Tests
        run: npm run test:solution-package

      # Gate the shippable deliverable. This step is EXPECTED to fail until a
      # corrected AgentSidecarCore.zip is exported from Dataverse (admin Code App
      # rebuilt via `pac code push -s AgentSidecarCore` + the maftagsc_prompts
      # column added, then `pac solution export`). Once the refreshed package is
      # committed, set `continue-on-error: false` to make this a hard release gate.
      - name: Validate Solution Package (advisory until re-export)
        continue-on-error: true
        run: npm run validate:solution-package

      - name: Build
        run: npm run build
