<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Sidecar</title>
    <style>
        :root {
            color-scheme: light;
            --cooper-blue: #005596;
            --cooper-blue-dark: #004270;
            --cooper-blue-soft: #e8f3f8;
            --cooper-purple: #6c2196;
            --cooper-teal: #008c95;
            --cooper-ink: #3f4143;
            --cooper-muted: #636466;
            --cooper-surface: #f7fafc;
            --cooper-line: #dbe5eb;
            font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, system-ui, Roboto, "Helvetica Neue", sans-serif;
            color: var(--cooper-ink);
            background: var(--cooper-surface);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
        }

        #status {
            box-sizing: border-box;
            display: grid;
            min-height: 100%;
            place-items: center;
            padding: 24px;
            text-align: center;
            background:
                radial-gradient(circle at 15% 10%, rgb(0 140 149 / 10%), transparent 34%),
                radial-gradient(circle at 90% 90%, rgb(108 33 150 / 8%), transparent 40%),
                var(--cooper-surface);
        }

        #status[hidden],
        #chat[hidden],
        #sign-in[hidden] {
            display: none;
        }

        #chat {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            background: var(--cooper-surface);
        }

        .chat-toolbar {
            box-sizing: border-box;
            display: flex;
            min-height: 58px;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--cooper-line);
            background: #ffffff;
            box-shadow: 0 2px 12px rgb(24 55 72 / 7%);
            z-index: 1;
        }

        .chat-brand {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 10px;
        }

        .brand-orb {
            width: 30px;
            height: 30px;
            flex: 0 0 auto;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 28%, #4eb8ba 0 11%, transparent 12%),
                linear-gradient(145deg, var(--cooper-blue), var(--cooper-teal) 52%, var(--cooper-purple));
            box-shadow: 0 3px 9px rgb(0 85 150 / 24%);
        }

        .chat-brand-copy {
            display: grid;
            min-width: 0;
            gap: 1px;
        }

        #chat-title {
            overflow: hidden;
            color: var(--cooper-ink);
            font-size: 14px;
            font-weight: 600;
            line-height: 18px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-kicker {
            color: var(--cooper-muted);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 14px;
        }

        #new-conversation {
            min-height: 34px;
            flex: 0 0 auto;
            padding: 6px 13px;
            border: 1px solid var(--cooper-blue);
            border-radius: 999px;
            color: var(--cooper-blue);
            background: #ffffff;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
        }

        #new-conversation:hover {
            color: #ffffff;
            background: var(--cooper-blue);
            box-shadow: 0 3px 10px rgb(0 85 150 / 20%);
        }

        #new-conversation:disabled {
            color: #a0a0a0;
            cursor: wait;
        }

        #new-conversation:focus-visible {
            outline: 2px solid var(--cooper-purple);
            outline-offset: 2px;
        }

        #webchat {
            min-width: 0;
            min-height: 0;
            background: var(--cooper-surface);
        }

        #webchat .webchat__bubble__content {
            box-shadow: 0 3px 12px rgb(24 55 72 / 9%);
        }

        #webchat .webchat__bubble--from-user .webchat__bubble__content {
            box-shadow: 0 4px 14px rgb(0 85 150 / 19%);
        }

        #webchat .webchat__bubble__content p {
            line-height: 1.5;
        }

        #webchat .webchat__bubble__content a {
            color: var(--cooper-blue);
            font-weight: 600;
        }

        #webchat .webchat__bubble--from-user .webchat__bubble__content a {
            color: #ffffff;
        }

        .status-card {
            box-sizing: border-box;
            width: min(100%, 340px);
            padding: 30px 26px;
            border: 1px solid rgb(219 229 235 / 90%);
            border-radius: 22px;
            background: rgb(255 255 255 / 94%);
            box-shadow: 0 18px 44px rgb(24 55 72 / 12%);
        }

        .status-brand-orb {
            width: 42px;
            height: 42px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--cooper-blue), var(--cooper-teal) 52%, var(--cooper-purple));
            box-shadow: 0 6px 16px rgb(0 85 150 / 24%);
        }

        .status-card h1 {
            margin: 0 0 8px;
            color: var(--cooper-ink);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .status-card p {
            margin: 0;
            color: var(--cooper-muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 0 auto 16px;
            border: 3px solid var(--cooper-blue-soft);
            border-top-color: var(--cooper-blue);
            border-right-color: var(--cooper-purple);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        #sign-in {
            min-height: 32px;
            margin-top: 18px;
            padding: 7px 18px;
            border: 1px solid var(--cooper-blue);
            border-radius: 999px;
            color: #ffffff;
            background: var(--cooper-blue);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgb(0 85 150 / 18%);
        }

        #sign-in:hover {
            border-color: var(--cooper-blue-dark);
            background: var(--cooper-blue-dark);
        }

        #sign-in:focus-visible {
            outline: 2px solid var(--cooper-purple);
            outline-offset: 2px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <main id="status" role="status" aria-live="polite">
        <div class="status-card">
            <div class="status-brand-orb" aria-hidden="true"></div>
            <div id="spinner" class="spinner" aria-hidden="true"></div>
            <h1 id="guide-title">Agent Sidecar</h1>
            <p id="status-message">Starting a secure conversation…</p>
            <button id="sign-in" type="button" hidden>Sign in</button>
        </div>
    </main>
    <div id="chat" role="region" aria-label="Agent Sidecar conversation" tabindex="-1" hidden>
        <div class="chat-toolbar" role="toolbar" aria-label="Conversation commands">
            <div class="chat-brand">
                <span class="brand-orb" aria-hidden="true"></span>
                <span class="chat-brand-copy">
                    <span id="chat-title">Agent Sidecar</span>
                    <span class="chat-kicker">Contextual assistant</span>
                </span>
            </div>
            <button
                id="new-conversation"
                type="button"
                title="Clear this chat and start a new conversation"
            >New conversation</button>
        </div>
        <div id="webchat"></div>
    </div>

    <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
    <!-- HR_AGENT_SIDEPANE_BUNDLE -->
</body>
</html>
